<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planning / Schedule">
<title>Planning Retraite</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --bg:#F5F4F0;--card:#FFFFFF;--text:#181816;--muted:#888680;--border:#E2E0D8;
  --radius:14px;--radius-sm:8px;
  --blue:#2D6BE4;--blue-bg:#EBF0FC;--blue-dark:#0C447C;
  --green:#1B8A5A;--green-bg:#E8F5EE;--green-dark:#085041;
  --purple:#534AB7;--purple-bg:#EEEDFE;--purple-dark:#3C3489;
  --amber:#C47A1A;--amber-bg:#FDF3E3;--amber-dark:#633806;
  --red:#C0392B;--red-bg:#FDECEA;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-dark:#085041;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.screen{display:none;min-height:100vh;}
.screen.active{display:flex;flex-direction:column;}

/* LANG */
#screen-lang{align-items:center;justify-content:center;padding:2rem 1.2rem;}
.lang-card{background:var(--card);border-radius:24px;border:1px solid var(--border);padding:2.5rem 2rem;width:100%;max-width:340px;text-align:center;}
.lang-icon{width:64px;height:64px;border-radius:18px;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
.lang-icon i{font-size:30px;color:var(--purple);}
.lang-title{font-size:20px;font-weight:600;margin-bottom:6px;}
.lang-sub{font-size:14px;color:var(--muted);margin-bottom:2rem;line-height:1.5;}
.lang-btns{display:flex;flex-direction:column;gap:10px;}
.lang-btn{padding:14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);font-family:'DM Sans',sans-serif;font-size:16px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.15s;}
.lang-btn:active{border-color:var(--purple);background:var(--purple-bg);color:var(--purple);}
.lang-flag{font-size:22px;}

/* LOGIN */
#screen-login{align-items:center;justify-content:center;padding:2rem 1.2rem;}
.login-card{background:var(--card);border-radius:24px;border:1px solid var(--border);padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center;}
.login-icon{width:64px;height:64px;border-radius:18px;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;}
.login-icon i{font-size:30px;color:var(--purple);}
.login-title{font-size:22px;font-weight:600;margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--muted);margin-bottom:6px;line-height:1.5;}
.login-week{font-size:12px;color:var(--purple);font-weight:500;margin-bottom:2rem;}
.code-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;text-align:left;}
.code-input{width:100%;font-family:'DM Mono',monospace;font-size:26px;font-weight:500;text-align:center;letter-spacing:8px;padding:14px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);margin-bottom:1rem;outline:none;transition:border-color 0.2s;}
.code-input:focus{border-color:var(--purple);}
.btn-login{width:100%;padding:14px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-login:active{opacity:0.85;}
.error-msg{font-size:13px;color:var(--red);margin-top:10px;min-height:18px;display:flex;align-items:center;justify-content:center;gap:5px;}
.lang-switch-btn{background:none;border:none;font-size:12px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:1rem;display:inline-flex;align-items:center;gap:5px;}

/* APP */
#screen-app{background:var(--bg);}
.app-header{background:var(--card);border-bottom:1px solid var(--border);padding:1rem 1.2rem 0;position:sticky;top:0;z-index:20;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.participant-info{display:flex;align-items:center;gap:10px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--purple-bg);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--purple);flex-shrink:0;}
.p-name{font-size:15px;font-weight:600;}
.p-week{font-size:12px;color:var(--muted);}
.quit-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;}
.day-tabs{display:flex;overflow-x:auto;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:10px 12px 12px;cursor:pointer;border-bottom:2.5px solid transparent;text-align:center;min-width:68px;transition:all 0.15s;}
.day-tab.active{border-bottom-color:var(--purple);}
.day-tab .dn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);}
.day-tab.active .dn{color:var(--purple);}
.day-tab .dd{font-size:17px;font-weight:600;color:var(--text);margin-top:2px;}
.day-tab .dc{font-size:10px;color:var(--muted);margin-top:1px;}
.day-panel{display:none;padding:1.2rem;}
.day-panel.active{display:block;}

/* Paradigm card */
.paradigm-card{border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid;}
.para-pps{background:var(--blue-bg);border-color:#B5D4F4;}
.para-fbi{background:var(--teal-bg);border-color:#9FE1CB;}
.para-cfs{background:var(--purple-bg);border-color:#CECBF6;}
.para-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.para-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.para-pps .para-icon{background:rgba(46,107,228,0.15);}
.para-fbi .para-icon{background:rgba(15,110,86,0.15);}
.para-cfs .para-icon{background:rgba(83,74,183,0.15);}
.para-pps .para-icon i{color:var(--blue);font-size:20px;}
.para-fbi .para-icon i{color:var(--teal);font-size:20px;}
.para-cfs .para-icon i{color:var(--purple);font-size:20px;}
.para-name{font-size:15px;font-weight:600;}
.para-pps .para-name{color:var(--blue-dark);}
.para-fbi .para-name{color:var(--teal-dark);}
.para-cfs .para-name{color:var(--purple-dark);}
.para-time-badge{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;padding:3px 8px;border-radius:99px;margin-left:auto;}
.para-pps .para-time-badge{background:rgba(46,107,228,0.12);color:var(--blue-dark);}
.para-fbi .para-time-badge{background:rgba(15,110,86,0.12);color:var(--teal-dark);}
.para-cfs .para-time-badge{background:rgba(83,74,183,0.12);color:var(--purple-dark);}
.para-desc{font-size:12px;line-height:1.55;margin-bottom:10px;}
.para-pps .para-desc{color:var(--blue-dark);}
.para-fbi .para-desc{color:var(--teal-dark);}
.para-cfs .para-desc{color:var(--purple-dark);}
.para-salle{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;}
.para-pps .para-salle{color:var(--blue);}
.para-fbi .para-salle{color:var(--teal);}
.para-cfs .para-salle{color:var(--purple);}

/* Survey buttons */
.survey-section{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.survey-btn-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
.survey-btn-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
.survey-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--green-bg);color:var(--green);border:1px solid #B2DFC8;border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;justify-content:center;}
.survey-btn:active{opacity:0.85;}
.survey-btn.locked{background:var(--amber-bg);color:var(--amber-dark);border-color:#FAC775;}
.survey-btn.unavailable{background:var(--bg);color:var(--muted);border-color:var(--border);cursor:default;}

/* Unlock modal */
.unlock-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:center;justify-content:center;padding:1.5rem;}
.unlock-overlay.open{display:flex;}
.unlock-box{background:var(--card);border-radius:20px;padding:2rem 1.5rem;width:100%;max-width:340px;text-align:center;}
.unlock-icon{width:52px;height:52px;border-radius:14px;background:var(--amber-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;}
.unlock-icon i{font-size:24px;color:var(--amber);}
.unlock-title{font-size:17px;font-weight:600;margin-bottom:6px;}
.unlock-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;line-height:1.5;}
.unlock-input{width:100%;font-family:'DM Mono',monospace;font-size:22px;font-weight:500;text-align:center;letter-spacing:6px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);margin-bottom:0.8rem;outline:none;}
.unlock-input:focus{border-color:var(--purple);}
.unlock-btn{width:100%;padding:12px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:8px;}
.unlock-btn:active{opacity:0.85;}
.unlock-cancel{width:100%;padding:10px;background:none;color:var(--muted);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;}
.unlock-error{font-size:13px;color:var(--red);margin-top:8px;min-height:16px;}

/* Sched */
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:10px;margin-top:16px;}
.schedule-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.sched-row{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;display:flex;gap:12px;align-items:center;}
.sched-row.highlight-pps{border-left:3px solid var(--blue);}
.sched-row.highlight-fbi{border-left:3px solid var(--teal);}
.sched-row.highlight-cfs{border-left:3px solid var(--purple);}
.sched-row.highlight-med{border-left:3px solid #7F77DD;}
.sched-row.highlight-meal{border-left:3px solid #639922;}
.sched-time{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;min-width:100px;color:var(--text);flex-shrink:0;}
.sched-title{font-size:13px;color:var(--text);flex:1;}
.sched-badge{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:500;flex-shrink:0;}
.badge-pps{background:var(--blue-bg);color:var(--blue-dark);}
.badge-fbi{background:var(--teal-bg);color:var(--teal-dark);}
.badge-cfs{background:var(--purple-bg);color:var(--purple-dark);}
.badge-med{background:var(--purple-bg);color:var(--purple-dark);}
.badge-libre{background:var(--bg);color:var(--muted);border:1px solid var(--border);}
.special-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
.progress-dots{display:flex;gap:6px;margin-bottom:1.5rem;align-items:center;}
.dot{width:10px;height:10px;border-radius:50%;}
.dot-pps{background:var(--blue);}
.dot-fbi{background:var(--teal);}
.dot-cfs{background:var(--purple);}
.dots-label{font-size:12px;color:var(--muted);margin-left:4px;}

/* ADMIN */
#screen-admin{background:var(--bg);padding:0;}
.admin-topbar{background:var(--card);border-bottom:1px solid var(--border);padding:1rem 1.2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
.admin-topbar-title{font-size:17px;font-weight:600;}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;font-size:13px;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;}
.admin-body{padding:1.2rem;}
.admin-section{margin-bottom:2rem;}
.admin-section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:12px;}

/* Pending requests in admin */
.request-card{background:var(--amber-bg);border:1px solid #FAC775;border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.request-info{flex:1;}
.request-who{font-size:13px;font-weight:600;color:var(--amber-dark);}
.request-what{font-size:12px;color:var(--amber);}
.request-code-box{background:var(--card);border:1px solid #FAC775;border-radius:var(--radius-sm);padding:6px 12px;text-align:center;}
.request-code{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--purple);letter-spacing:4px;}
.request-code-label{font-size:10px;color:var(--muted);}
.no-requests{font-size:13px;color:var(--muted);text-align:center;padding:1rem;}

.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.p-card-admin{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;transition:border-color 0.15s;}
.p-card-admin:active{border-color:var(--purple);}
.p-card-code{font-family:'DM Mono',monospace;font-size:16px;font-weight:500;color:var(--purple);margin-bottom:3px;}
.p-card-name{font-size:12px;color:var(--muted);margin-bottom:6px;}
.p-card-sessions{display:flex;gap:3px;flex-wrap:wrap;}
.para-tag{font-size:10px;padding:1px 6px;border-radius:99px;font-weight:500;}
.tag-pps{background:var(--blue-bg);color:var(--blue-dark);}
.tag-fbi{background:var(--teal-bg);color:var(--teal-dark);}
.tag-cfs{background:var(--purple-bg);color:var(--purple-dark);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:1.5rem 1.2rem 2rem;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem;}
.modal-close{float:right;background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;margin-top:-4px;}
.field-group{margin-bottom:1.2rem;}
.field-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
.field-input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--bg);color:var(--text);outline:none;}
.field-input:focus{border-color:var(--purple);}
select.field-input{appearance:none;cursor:pointer;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-save{width:100%;padding:13px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:0.5rem;}
.btn-save:active{opacity:0.85;}
.btn-danger{width:100%;padding:11px;background:none;color:var(--red);border:1px solid #FACACA;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:8px;}
.session-slot{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
.session-slot-title{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text);}
.summary-table{width:100%;border-collapse:collapse;font-size:12px;}
.summary-table th{text-align:left;padding:6px 8px;background:var(--bg);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;}
.summary-table td{padding:8px 8px;border-bottom:1px solid var(--border);vertical-align:middle;}
.summary-table tr:last-child td{border-bottom:none;}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#1A1A18;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}
.add-p-btn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px dashed var(--border);border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;font-size:14px;color:var(--muted);width:100%;font-family:'DM Sans',sans-serif;margin-top:8px;}
.add-p-btn:active{border-color:var(--purple);color:var(--purple);}

/* Survey admin config */
.survey-config{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.survey-config-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;}
.survey-config-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.survey-config-label{font-size:11px;color:var(--muted);min-width:80px;flex-shrink:0;}
.survey-config-input{flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:'DM Sans',sans-serif;background:var(--card);color:var(--text);outline:none;}
.survey-config-input:focus{border-color:var(--purple);}
.btn-save-surveys{padding:10px 16px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;margin-top:8px;}
</style>
</head>
<body>

<!-- LANG -->
<div id="screen-lang" class="screen active">
  <div class="lang-card">
    <div class="lang-icon"><i class="ti ti-brain"></i></div>
    <p class="lang-title">Meditation Retreat</p>
    <p class="lang-sub">Choisissez votre langue / Choose your language</p>
    <div class="lang-btns">
      <button class="lang-btn" onclick="setLang('fr')"><span class="lang-flag">🇫🇷</span> Français</button>
      <button class="lang-btn" onclick="setLang('en')"><span class="lang-flag">🇬🇧</span> English</button>
    </div>
  </div>
</div>

<!-- LOGIN -->
<div id="screen-login" class="screen">
  <div class="login-card">
    <div class="login-icon"><i class="ti ti-brain"></i></div>
    <h1 class="login-title" id="login-title"></h1>
    <p class="login-sub" id="login-sub"></p>
    <p class="login-week" id="login-week"></p>
    <p class="code-label" id="login-code-label"></p>
    <input class="code-input" id="code-input" type="text" maxlength="6" placeholder="P001" autocomplete="off">
    <button class="btn-login" onclick="login()">
      <i class="ti ti-arrow-right" style="font-size:17px"></i><span id="login-btn-text"></span>
    </button>
    <p class="error-msg" id="error-msg"></p>
    <div style="margin-top:1rem;text-align:center;">
      <button class="lang-switch-btn" onclick="show('screen-lang')"><i class="ti ti-world" style="font-size:14px"></i><span id="lang-switch-label"></span></button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <div class="app-header">
    <div class="header-top">
      <div class="participant-info">
        <div class="avatar" id="av"></div>
        <div>
          <p class="p-name" id="pname"></p>
          <p class="p-week" id="app-week-label"></p>
        </div>
      </div>
      <button class="quit-btn" onclick="logout()"><i class="ti ti-logout" style="font-size:15px"></i><span id="quit-label"></span></button>
    </div>
    <div class="day-tabs" id="day-tabs"></div>
  </div>
  <div id="day-panels"></div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen">
  <div class="admin-topbar">
    <button class="back-btn" onclick="show('screen-login')"><i class="ti ti-arrow-left" style="font-size:15px"></i><span id="back-label"></span></button>
    <span class="admin-topbar-title" id="admin-title-label"></span>
    <span style="font-size:11px;color:var(--muted)">092026</span>
  </div>
  <div class="admin-body">

    <!-- Pending requests -->
    <div class="admin-section">
      <p class="admin-section-title" id="requests-label"></p>
      <div id="requests-list"></div>
    </div>

const ORDRES=[['PPS','FBI','CFS'],['PPS','CFS','FBI'],['FBI','PPS','CFS'],['FBI','CFS','PPS'],['CFS','PPS','FBI'],['CFS','FBI','PPS']];

function loadData(){try{const r=localStorage.getItem('retraite_v3');if(r)return JSON.parse(r);}catch(e){}return generateDefault(20);}
function saveData(d){try{localStorage.setItem('retraite_v3',JSON.stringify(d));}catch(e){}}

function generateDefault(n){
  const ps={};
  const combos=[];
  for(let a=1;a<=5;a++)for(let b=a+2;b<=6;b++)for(let c=b+2;c<=7;c++)combos.push([a,b,c]);
  for(let i=0;i<n;i++){
    const code='P'+String(i+1).padStart(3,'0');
    const ordre=ORDRES[i%6];
    const combo=combos[i%combos.length];
    const cb=i%3;
    const sessions=combo.map((jour,k)=>{let cr=(cb+k)%3;if(jour===1&&cr===0)cr=1;return{paradigme:ordre[k],jour,creneau:cr};});
    const planning={};
    for(let d=0;d<8;d++){const s=sessions.find(x=>x.jour===d);if(d===0)planning[d]={type:'arrivee'};else if(s)planning[d]={type:'session',paradigme:s.paradigme,creneau:s.creneau};else planning[d]={type:'libre'};}
    ps[code]={nom:'Participant '+String(i+1).padStart(2,'0'),ordre,planning};
  }
  return ps;
}

// Requests storage
function loadRequests(){try{const r=localStorage.getItem('requests_v1');if(r)return JSON.parse(r);}catch(e){}return [];}
function saveRequests(d){try{localStorage.setItem('requests_v1',JSON.stringify(d));}catch(e){}}
function addRequest(participantCode,participantName,surveyKey){
  const reqs=loadRequests();
  // avoid duplicates
  const exists=reqs.find(r=>r.code===participantCode&&r.key===surveyKey);
  if(!exists) reqs.push({code:participantCode,name:participantName,key:surveyKey,time:Date.now()});
  saveRequests(reqs);
}
function removeRequest(participantCode,surveyKey){
  let reqs=loadRequests();
  reqs=reqs.filter(r=>!(r.code===participantCode&&r.key===surveyKey));
  saveRequests(reqs);
}

  err.textContent='';renderApp(code);show('screen-app');
}

  const JOURS=[
    {court:t.dayNames[0],long:t.dayLong[0],num:t.dayShort[0]},
    {court:t.dayNames[1],long:t.dayLong[1],num:t.dayShort[1],dimanchematin:true},
    {court:t.dayNames[2],long:t.dayLong[2],num:t.dayShort[2]},
    {court:t.dayNames[3],long:t.dayLong[3],num:t.dayShort[3]},
    {court:t.dayNames[4],long:t.dayLong[4],num:t.dayShort[4]},
    {court:t.dayNames[5],long:t.dayLong[5],num:t.dayShort[5]},
    {court:t.dayNames[6],long:t.dayLong[6],num:t.dayShort[6]},
    {court:t.dayNames[7],long:t.dayLong[7],num:t.dayShort[7],departSoir:true},
  ];
  document.getElementById('av').textContent=code;
  document.getElementById('pname').textContent=p.nom;
  const tabs=document.getElementById('day-tabs'),panels=document.getElementById('day-panels');
  tabs.innerHTML='';panels.innerHTML='';
  JOURS.forEach((jour,i)=>{
    const dd=p.planning[i];
    let count=dd.type==='session'?t.tabSession:dd.type==='arrivee'?t.tabArrivee:t.tabLibre;
    const tab=document.createElement('div');
    tab.className='day-tab'+(i===0?' active':'');tab.dataset.d=i;
    tab.innerHTML=`<div class="dn">${jour.court}</div><div class="dd">${jour.num}</div><div class="dc">${count}</div>`;
    tab.onclick=()=>switchDay(i);tabs.appendChild(tab);
    const panel=document.createElement('div');
    panel.className='day-panel'+(i===0?' active':'');panel.dataset.d=i;
    panel.innerHTML=buildDayHTML(jour,dd,p,code,t);
    panels.appendChild(panel);
  });
}

function buildDayHTML(jour,dayData,p,code,t){
  let html=`<div style="margin-bottom:14px"><p style="font-size:17px;font-weight:600;margin-bottom:3px">${jour.long}</p>`;
  const dots=p.ordre.map(pa=>`<span class="dot dot-${pa.toLowerCase()}" title="${pa}"></span>`).join('');
  html+=`<div class="progress-dots">${dots}<span class="dots-label">${t.paradigmsLabel}${p.ordre.join(' → ')}</span></div></div>`;

  const sunNote=jour.dimanchematin?`<div style="background:var(--amber-bg);border:1px solid #FAC775;border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--amber-dark)"><i class="ti ti-info-circle" style="font-size:14px;vertical-align:-2px;margin-right:6px"></i>${t.sunInfo}</div>`:'';
  const depNote=jour.departSoir?`<div style="background:var(--blue-bg);border:1px solid #B5D4F4;border-radius:var(--radius-sm);padding:9px 12px;margin-bottom:12px;font-size:12px;color:var(--blue-dark)"><i class="ti ti-bus" style="font-size:14px;vertical-align:-2px;margin-right:6px"></i>${t.departNote}</div>`:'';

  if(dayData.type==='arrivee'){
    html+=`<div class="special-card"><p style="font-size:15px;font-weight:600;margin-bottom:4px;color:var(--amber)"><i class="ti ti-bus" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>${t.arriveeTitle}</p><p style="font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px">${t.arriveeSub}</p></div>
    <div class="section-label">${t.scheduleLabel}</div><div class="schedule-list">`;
    t.arriveeSched.forEach(r=>{const b=r.badge?`<span class="sched-badge badge-${r.badge}">${r.badgeLabel}</span>`:'';html+=`<div class="sched-row ${r.hl}"><div class="sched-time">${r.time}</div><div class="sched-title">${r.title}</div>${b}</div>`;});
    html+=`</div>`;
  } else if(dayData.type==='session'){
    const para=t.paradigms[dayData.paradigme];
    const creneau=t.horaires[dayData.creneau];
    html+=sunNote+depNote;
    html+=`<div class="section-label">${t.sessionLabel}</div>
    <div class="paradigm-card para-${dayData.paradigme.toLowerCase()}">
      <div class="para-header">
        <div class="para-icon"><i class="ti ${para.icone}"></i></div>
        <div><p class="para-name">${para.nom}</p><div class="para-salle"><i class="ti ti-map-pin" style="font-size:13px"></i>${para.salle}</div></div>
        <span class="para-time-badge">${creneau.debut}–${creneau.fin}</span>
      </div>
      <p class="para-desc">${para.desc}</p>
      <div class="para-salle"><i class="ti ti-clock" style="font-size:13px"></i>${t.duration}</div>
      ${buildSurveyButtons(dayData.paradigme, code, p.nom, t)}
    </div>
    <div class="section-label">${t.schedLabel}</div><div class="schedule-list">`;
    t.journeeType.forEach(row=>{
      let title=row.title,badge='',hl=row.hl||'';
      if(typeof row.creneauIdx!=='undefined'){
        if(jour.dimanchematin&&row.creneauIdx===0){title=t.sunFreeSlot;badge=`<span class="sched-badge badge-libre">${lang==='fr'?'Libre':'Free'}</span>`;hl='';}
        else if(row.creneauIdx===dayData.creneau){title=`<strong>${t.yourSession}${para.nom}</strong> — ${para.salle}`;badge=`<span class="sched-badge badge-${dayData.paradigme.toLowerCase()}">${dayData.paradigme}</span>`;hl=`highlight-${dayData.paradigme.toLowerCase()}`;}
        else{title=t.freeSlotLabel;badge=`<span class="sched-badge badge-libre">${lang==='fr'?'Libre':'Free'}</span>`;}
      } else if(row.badge){badge=`<span class="sched-badge badge-${row.badge}">${row.badgeLabel}</span>`;}
      html+=`<div class="sched-row ${hl}"><div class="sched-time">${row.time}</div><div class="sched-title">${title}</div>${badge}</div>`;
    });
    if(jour.departSoir)html+=`<div class="sched-row" style="border-left:3px solid var(--amber)"><div class="sched-time">22:00+</div><div class="sched-title">${t.departRow}</div><span class="sched-badge" style="background:var(--amber-bg);color:var(--amber-dark)">${t.departBadge}</span></div>`;
    html+=`</div>`;
  } else {
    html+=sunNote+depNote;
    html+=`<div class="special-card"><p style="font-size:15px;font-weight:600;margin-bottom:4px;color:var(--muted)"><i class="ti ti-sun" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>${t.libreTitle}</p><p style="font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px">${t.libreSub}</p></div>
    <div class="section-label">${t.schedLabel}</div><div class="schedule-list">`;
    t.journeeType.forEach(row=>{
      let title=row.title,badge=`<span class="sched-badge badge-libre">${lang==='fr'?'Libre':'Free'}</span>`,hl=row.hl||'';
      if(typeof row.creneauIdx!=='undefined'){title=jour.dimanchematin&&row.creneauIdx===0?t.sunFreeSlot:t.freeSlot;}
      else if(row.badge){badge=`<span class="sched-badge badge-${row.badge}">${row.badgeLabel}</span>`;}
      html+=`<div class="sched-row ${hl}"><div class="sched-time">${row.time}</div><div class="sched-title">${title}</div>${badge}</div>`;
    });
    if(jour.departSoir)html+=`<div class="sched-row" style="border-left:3px solid var(--amber)"><div class="sched-time">22:00+</div><div class="sched-title">${t.departRow}</div><span class="sched-badge" style="background:var(--amber-bg);color:var(--amber-dark)">${t.departBadge}</span></div>`;
    html+=`</div>`;
  }
  return html;
}

function buildSurveyButtons(paradigme, code, nom, t){
  const s=SURVEYS[paradigme];
  let html=`<div class="survey-section">`;

  // Before survey
  const beforeUrl=s.before[lang];
  if(beforeUrl){
    html+=`<div class="survey-btn-wrap">
      <p class="survey-btn-label"><i class="ti ti-clipboard-list" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>${t.surveyBefore} ${paradigme}</p>
      <button class="survey-btn locked" onclick="openUnlock('${beforeUrl}','${code}','${nom}','before_${paradigme}')">
        <i class="ti ti-lock" style="font-size:15px"></i>${t.surveyLocked}
      </button>
    </div>`;
  }

  // After survey
  const afterUrl=s.after[lang];
  if(afterUrl){
    html+=`<div class="survey-btn-wrap">
      <p class="survey-btn-label"><i class="ti ti-clipboard-check" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>${t.surveyAfter} ${paradigme}</p>
      <button class="survey-btn locked" onclick="openUnlock('${afterUrl}','${code}','${nom}','after_${paradigme}')">
        <i class="ti ti-lock" style="font-size:15px"></i>${t.surveyLocked}
      </button>
    </div>`;
  }

  html+=`</div>`;
  return html;
}

function switchDay(i){
  document.querySelectorAll('.day-tab').forEach(t=>t.classList.toggle('active',+t.dataset.d===i));
  document.querySelectorAll('.day-panel').forEach(p=>p.classList.toggle('active',+p.dataset.d===i));
}

// ══════════════════════════════════════
//  UNLOCK
// ══════════════════════════════════════
function openUnlock(url, pCode, pNom, surveyKey){
  pendingUnlockUrl=url;
  pendingUnlockCode={pCode,pNom,surveyKey};
  // Register request for admin
  addRequest(pCode, pNom, surveyKey);
  document.getElementById('unlock-input').value='';
  document.getElementById('unlock-error').textContent='';
  document.getElementById('unlock-overlay').classList.add('open');
  document.getElementById('unlock-input').focus();
}

function tryUnlock(){
  const t=T[lang];
  const val=document.getElementById('unlock-input').value.trim();
  if(val===SURVEY_UNLOCK_CODE){
    document.getElementById('unlock-overlay').classList.remove('open');
    if(pendingUnlockCode) removeRequest(pendingUnlockCode.pCode, pendingUnlockCode.surveyKey);
    window.open(pendingUnlockUrl,'_blank');
    pendingUnlockUrl=null;pendingUnlockCode=null;
  } else {
    document.getElementById('unlock-error').textContent=t.unlockError;
    document.getElementById('unlock-input').value='';
  }
}

document.getElementById('unlock-input').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
document.getElementById('unlock-input').addEventListener('input',e=>{document.getElementById('unlock-error').textContent='';});

function closeUnlock(){
  document.getElementById('unlock-overlay').classList.remove('open');
  pendingUnlockUrl=null;pendingUnlockCode=null;
}

// ══════════════════════════════════════
//  ADMIN
// ══════════════════════════════════════
function renderAdmin(){
  const t=T[lang];
  renderRequests();
  renderSurveysConfig();
  renderSummary();
  const grid=document.getElementById('admin-grid');grid.innerHTML='';
  Object.entries(PARTICIPANTS).forEach(([code,p])=>{
    const sessions=Object.values(p.planning).filter(d=>d.type==='session');
    const card=document.createElement('div');card.className='p-card-admin';
    card.innerHTML=`<div class="p-card-code">${code}</div><div class="p-card-name">${p.nom}</div>
      <div class="p-card-sessions">${sessions.map(s=>`<span class="para-tag tag-${s.paradigme.toLowerCase()}">${s.paradigme}</span>`).join('')}</div>`;
    card.onclick=()=>openEditModal(code);grid.appendChild(card);
  });
}

function renderRequests(){
  const t=T[lang];
  const reqs=loadRequests();
  const list=document.getElementById('requests-list');
  if(reqs.length===0){list.innerHTML=`<p class="no-requests">${t.noRequests}</p>`;return;}
  list.innerHTML='';
  reqs.forEach(r=>{
    const div=document.createElement('div');div.className='request-card';
    const surveyName=r.key.replace('before_',t.beforeLabel+' ').replace('after_',t.afterLabel+' ');
    div.innerHTML=`
      <div class="request-info">
        <p class="request-who">${r.name} (${r.code})</p>
        <p class="request-what">${surveyName}</p>
      </div>
      <div class="request-code-box">
        <div class="request-code">${SURVEY_UNLOCK_CODE}</div>
        <div class="request-code-label">${t.requestCodeLabel}</div>
      </div>`;
    list.appendChild(div);
  });
}

function renderSurveysConfig(){
  const t=T[lang];
  const container=document.getElementById('surveys-config-list');
  container.innerHTML='';
  ['PPS','FBI','CFS'].forEach(para=>{
    const div=document.createElement('div');div.className='survey-config';
    div.innerHTML=`<p class="survey-config-title">${para}</p>
    <div class="survey-config-row">
      <span class="survey-config-label">${t.beforeLabel} (FR)</span>
      <input class="survey-config-input" id="sc-${para}-before-fr" value="${SURVEYS[para].before.fr||''}" placeholder="https://...">
    </div>
    <div class="survey-config-row">
      <span class="survey-config-label">${t.beforeLabel} (EN)</span>
      <input class="survey-config-input" id="sc-${para}-before-en" value="${SURVEYS[para].before.en||''}" placeholder="https://...">
    </div>
    <div class="survey-config-row">
      <span class="survey-config-label">${t.afterLabel} (FR)</span>
      <input class="survey-config-input" id="sc-${para}-after-fr" value="${SURVEYS[para].after.fr||''}" placeholder="https://...">
    </div>
    <div class="survey-config-row">
      <span class="survey-config-label">${t.afterLabel} (EN)</span>
      <input class="survey-config-input" id="sc-${para}-after-en" value="${SURVEYS[para].after.en||''}" placeholder="https://...">
    </div>`;
    container.appendChild(div);
  });
}

function saveSurveyLinks(){
  const t=T[lang];
  ['PPS','FBI','CFS'].forEach(para=>{
    SURVEYS[para].before.fr=document.getElementById(`sc-${para}-before-fr`).value.trim();
    SURVEYS[para].before.en=document.getElementById(`sc-${para}-before-en`).value.trim();
    SURVEYS[para].after.fr=document.getElementById(`sc-${para}-after-fr`).value.trim();
    SURVEYS[para].after.en=document.getElementById(`sc-${para}-after-en`).value.trim();
  });
  saveSurveysData(SURVEYS);
  showToast(t.toastSurveys);
}

function renderSummary(){
  const t=T[lang];const table=document.getElementById('summary-table');
  let html=`<tr><th>${t.summaryDay}</th><th>${t.summaryMorn}</th><th>${t.summaryAfter}</th><th>${t.summaryEve}</th></tr>`;
  for(let d=1;d<=7;d++){
    const slots=[0,1,2].map(c=>{
      if(d===1&&c===0)return`<span style="font-size:11px;color:var(--muted);font-style:italic">${t.sunMornBlocked}</span>`;
      const ps=Object.entries(PARTICIPANTS).filter(([,p])=>p.planning[d]?.type==='session'&&p.planning[d]?.creneau===c);
      return ps.map(([code,p])=>{const para=p.planning[d].paradigme;const colors={PPS:'#2D6BE4',FBI:'#0F6E56',CFS:'#534AB7'};return`<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;margin-bottom:2px"><span style="width:7px;height:7px;border-radius:50%;background:${colors[para]};display:inline-block"></span>${code}</span>`;}).join('')||'<span style="font-size:11px;color:var(--muted)">—</span>';
    });
    html+=`<tr><td style="font-weight:500">${t.summaryDays[d-1]}</td>${slots.map(s=>`<td>${s}</td>`).join('')}</tr>`;
  }
  table.innerHTML=html;
}

function openEditModal(code){
  const t=T[lang];isAdding=false;editingCode=code;const p=PARTICIPANTS[code];
  document.getElementById('modal-title').textContent=t.modalNomLabel+' — '+code;
  document.getElementById('modal-sub').textContent=p.nom;
  document.getElementById('edit-nom').value=p.nom;
  document.getElementById('btn-delete').style.display='block';
  const sessions=Object.entries(p.planning).filter(([,d])=>d.type==='session').map(([ji,d])=>({jour:parseInt(ji),paradigme:d.paradigme,creneau:d.creneau}));
  sessions.sort((a,b)=>a.jour-b.jour);
  for(let i=0;i<3;i++){const s=sessions[i]||{paradigme:'PPS',jour:i+1,creneau:i};setSelect('s'+i+'-para',s.paradigme);setSelect('s'+i+'-jour',String(s.jour));setSelect('s'+i+'-creneau',String(s.creneau));}
  document.getElementById('modal-overlay').classList.add('open');
}

function openAddModal(){
  const t=T[lang];isAdding=true;editingCode=null;
  const nextNum=Object.keys(PARTICIPANTS).length+1;const newCode='P'+String(nextNum).padStart(3,'0');
  document.getElementById('modal-title').textContent=t.addParticipant;
  document.getElementById('modal-sub').textContent=t.newCode+' '+newCode;
  document.getElementById('edit-nom').value='Participant '+String(nextNum).padStart(2,'0');
  document.getElementById('btn-delete').style.display='none';
  setSelect('s0-para','PPS');setSelect('s0-jour','1');setSelect('s0-creneau','0');
  setSelect('s1-para','FBI');setSelect('s1-jour','3');setSelect('s1-creneau','1');
  setSelect('s2-para','CFS');setSelect('s2-jour','5');setSelect('s2-creneau','2');
  document.getElementById('modal-overlay').classList.add('open');
}

function setSelect(id,val){const el=document.getElementById(id);if(el)el.value=val;}

function saveParticipant(){
  const t=T[lang];const nom=document.getElementById('edit-nom').value.trim();
  if(!nom){showToast(t.errorEmptyName);return;}
  const sessions=[];
  for(let i=0;i<3;i++)sessions.push({para:document.getElementById('s'+i+'-para').value,jour:parseInt(document.getElementById('s'+i+'-jour').value),creneau:parseInt(document.getElementById('s'+i+'-creneau').value)});
  if(new Set(sessions.map(s=>s.jour)).size<3){showToast(t.errorDupDay);return;}
  const planning={};
  for(let d=0;d<8;d++){if(d===0)planning[d]={type:'arrivee'};else planning[d]={type:'libre'};}
  sessions.forEach(s=>{planning[s.jour]={type:'session',paradigme:s.para,creneau:s.creneau};});
  const ordre=sessions.map(s=>s.para);
  if(isAdding){const nc='P'+String(Object.keys(PARTICIPANTS).length+1).padStart(3,'0');PARTICIPANTS[nc]={nom,ordre,planning};}
  else{PARTICIPANTS[editingCode]={...PARTICIPANTS[editingCode],nom,ordre,planning};}
  saveData(PARTICIPANTS);closeModalDirect();renderAdmin();showToast(isAdding?t.toastAdded:t.toastUpdated);
}

function deleteParticipant(){
  const t=T[lang];if(!editingCode)return;
  if(!confirm((lang==='fr'?'Supprimer ':'Delete ')+editingCode+' ?'))return;
  delete PARTICIPANTS[editingCode];saveData(PARTICIPANTS);closeModalDirect();renderAdmin();showToast(t.toastDeleted);
}

function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modal-overlay').classList.remove('open');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

applyLangUI();
</script>
