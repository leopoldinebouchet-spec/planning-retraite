<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Retraite Planning">
<title>Planning Retraite</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --bg: #F5F4F0;
  --card: #FFFFFF;
  --text: #181816;
  --muted: #888680;
  --border: #E2E0D8;
  --radius: 14px;
  --radius-sm: 8px;
  --blue: #2D6BE4; --blue-bg: #EBF0FC; --blue-dark: #0C447C;
  --green: #1B8A5A; --green-bg: #E8F5EE; --green-dark: #085041;
  --purple: #534AB7; --purple-bg: #EEEDFE; --purple-dark: #3C3489;
  --amber: #C47A1A; --amber-bg: #FDF3E3; --amber-dark: #633806;
  --red: #C0392B; --red-bg: #FDECEA;
  --teal: #0F6E56; --teal-bg: #E1F5EE; --teal-dark: #085041;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* LOGIN */
#screen-login { align-items: center; justify-content: center; padding: 2rem 1.2rem; }
.login-card { background: var(--card); border-radius: 24px; border: 1px solid var(--border); padding: 2.5rem 2rem; width: 100%; max-width: 360px; text-align: center; }
.login-icon { width: 64px; height: 64px; border-radius: 18px; background: var(--purple-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
.login-icon i { font-size: 30px; color: var(--purple); }
.login-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.login-sub { font-size: 14px; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
.login-week { font-size: 12px; color: var(--purple); font-weight: 500; margin-bottom: 2rem; }
.code-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; text-align: left; }
.code-input { width: 100%; font-family: 'DM Mono', monospace; font-size: 26px; font-weight: 500; text-align: center; letter-spacing: 8px; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); margin-bottom: 1rem; outline: none; transition: border-color 0.2s; }
.code-input:focus { border-color: var(--purple); }
.btn-login { width: 100%; padding: 14px; background: var(--purple); color: #fff; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 0.15s; }
.btn-login:active { opacity: 0.85; }
.error-msg { font-size: 13px; color: var(--red); margin-top: 10px; min-height: 18px; display: flex; align-items: center; justify-content: center; gap: 5px; }
.admin-link { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
.admin-link button { background: none; border: none; font-size: 12px; color: var(--muted); cursor: pointer; font-family: 'DM Sans', sans-serif; }

/* APP */
#screen-app { background: var(--bg); }
.app-header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 1.2rem 0; position: sticky; top: 0; z-index: 20; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.participant-info { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--purple-bg); display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; color: var(--purple); flex-shrink: 0; }
.p-name { font-size: 15px; font-weight: 600; }
.p-week { font-size: 12px; color: var(--muted); }
.quit-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: 'DM Sans', sans-serif; }

/* Day tabs */
.day-tabs { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab { flex-shrink: 0; padding: 10px 12px 12px; cursor: pointer; border-bottom: 2.5px solid transparent; text-align: center; min-width: 68px; transition: all 0.15s; }
.day-tab.active { border-bottom-color: var(--purple); }
.day-tab .dn { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
.day-tab.active .dn { color: var(--purple); }
.day-tab .dd { font-size: 17px; font-weight: 600; color: var(--text); margin-top: 2px; }
.day-tab .dc { font-size: 10px; color: var(--muted); margin-top: 1px; }

/* Day panels */
.day-panel { display: none; padding: 1.2rem; }
.day-panel.active { display: block; }

/* Paradigm card */
.paradigm-card { border-radius: var(--radius); padding: 16px; margin-bottom: 12px; border: 1px solid; }
.para-pps { background: var(--blue-bg); border-color: #B5D4F4; }
.para-fbi { background: var(--teal-bg); border-color: #9FE1CB; }
.para-cfs { background: var(--purple-bg); border-color: #CECBF6; }
.para-libre { background: var(--bg); border-color: var(--border); }
.para-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.para-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.para-pps .para-icon { background: rgba(46,107,228,0.15); }
.para-fbi .para-icon { background: rgba(15,110,86,0.15); }
.para-cfs .para-icon { background: rgba(83,74,183,0.15); }
.para-libre .para-icon { background: var(--border); }
.para-pps .para-icon i { color: var(--blue); font-size: 20px; }
.para-fbi .para-icon i { color: var(--teal); font-size: 20px; }
.para-cfs .para-icon i { color: var(--purple); font-size: 20px; }
.para-libre .para-icon i { color: var(--muted); font-size: 20px; }
.para-name { font-size: 15px; font-weight: 600; }
.para-pps .para-name { color: var(--blue-dark); }
.para-fbi .para-name { color: var(--teal-dark); }
.para-cfs .para-name { color: var(--purple-dark); }
.para-libre .para-name { color: var(--muted); }
.para-time-badge { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 99px; margin-left: auto; }
.para-pps .para-time-badge { background: rgba(46,107,228,0.12); color: var(--blue-dark); }
.para-fbi .para-time-badge { background: rgba(15,110,86,0.12); color: var(--teal-dark); }
.para-cfs .para-time-badge { background: rgba(83,74,183,0.12); color: var(--purple-dark); }
.para-libre .para-time-badge { background: var(--border); color: var(--muted); }

.para-desc { font-size: 12px; line-height: 1.55; margin-bottom: 10px; }
.para-pps .para-desc { color: var(--blue-dark); }
.para-fbi .para-desc { color: var(--teal-dark); }
.para-cfs .para-desc { color: var(--purple-dark); }
.para-libre .para-desc { color: var(--muted); }

.para-salle { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; }
.para-pps .para-salle { color: var(--blue); }
.para-fbi .para-salle { color: var(--teal); }
.para-cfs .para-salle { color: var(--purple); }
.para-libre .para-salle { color: var(--muted); }

.survey-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 14px; background: var(--green-bg); color: var(--green); border: 1px solid #B2DFC8; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; font-family: 'DM Sans', sans-serif; }

/* Schedule section */
.section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 10px; margin-top: 16px; }

.schedule-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.sched-row { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; display: flex; gap: 12px; align-items: center; }
.sched-row.highlight-pps { border-left: 3px solid var(--blue); }
.sched-row.highlight-fbi { border-left: 3px solid var(--teal); }
.sched-row.highlight-cfs { border-left: 3px solid var(--purple); }
.sched-row.highlight-med { border-left: 3px solid #7F77DD; }
.sched-row.highlight-meal { border-left: 3px solid #639922; }
.sched-time { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; min-width: 100px; color: var(--text); flex-shrink: 0; }
.sched-title { font-size: 13px; color: var(--text); flex: 1; }
.sched-badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 500; flex-shrink: 0; }
.badge-pps { background: var(--blue-bg); color: var(--blue-dark); }
.badge-fbi { background: var(--teal-bg); color: var(--teal-dark); }
.badge-cfs { background: var(--purple-bg); color: var(--purple-dark); }
.badge-med { background: var(--purple-bg); color: var(--purple-dark); }
.badge-libre { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }

/* Special days */
.special-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
.special-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.special-sub { font-size: 13px; color: var(--muted); line-height: 1.5; }

/* Progress dots */
.progress-dots { display: flex; gap: 6px; margin-bottom: 1.5rem; align-items: center; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-pps { background: var(--blue); }
.dot-fbi { background: var(--teal); }
.dot-cfs { background: var(--purple); }
.dot-pending { background: var(--border); }
.dots-label { font-size: 12px; color: var(--muted); margin-left: 4px; }

/* ADMIN */
#screen-admin { padding: 1.5rem; background: var(--bg); }
.back-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; color: var(--text); cursor: pointer; margin-bottom: 1.5rem; font-family: 'DM Sans', sans-serif; }
.admin-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
.admin-sub { font-size: 13px; color: var(--muted); margin-bottom: 1.5rem; }
.p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.p-tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; cursor: pointer; transition: border-color 0.15s; }
.p-tile:active { border-color: var(--purple); }
.p-tile-code { font-family: 'DM Mono', monospace; font-size: 17px; font-weight: 500; color: var(--purple); margin-bottom: 3px; }
.p-tile-name { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-icon"><i class="ti ti-brain"></i></div>
    <h1 class="login-title">Retraite de méditation</h1>
    <p class="login-sub">Entrez votre code pour accéder à votre planning personnalisé</p>
    <p class="login-week">Semaine J1 → J8</p>
    <p class="code-label">Votre code participant</p>
    <input class="code-input" id="code-input" type="text" maxlength="4" placeholder="P001" autocomplete="off">
    <button class="btn-login" onclick="login()">
      <i class="ti ti-arrow-right" style="font-size:17px"></i>Voir mon planning
    </button>
    <p class="error-msg" id="error-msg"></p>
    <div class="admin-link">
      <button onclick="showAdmin()"><i class="ti ti-settings" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>Accès administrateur</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <div class="app-header">
    <div class="header-top">
      <div class="participant-info">
        <div class="avatar" id="av"></div>
        <div>
          <p class="p-name" id="pname"></p>
          <p class="p-week">Retraite · Semaine complète</p>
        </div>
      </div>
      <button class="quit-btn" onclick="logout()"><i class="ti ti-logout" style="font-size:15px"></i>Quitter</button>
    </div>
    <div class="day-tabs" id="day-tabs"></div>
  </div>
  <div id="day-panels"></div>
</div>

<!-- ADMIN -->
<div id="screen-admin" class="screen">
  <button class="back-btn" onclick="show('screen-login')"><i class="ti ti-arrow-left" style="font-size:15px"></i>Retour</button>
  <p class="admin-title">Administrateur</p>
  <p class="admin-sub">Sélectionnez un participant pour prévisualiser son planning</p>
  <div class="p-grid" id="admin-grid"></div>
</div>

<script>
const LIMESURVEY = "https://votre-limesurvey.com/survey";

const JOURS = [
  { court:"Sam", long:"Samedi J1",   num:"J1" },
  { court:"Dim", long:"Dimanche J2", num:"J2" },
  { court:"Lun", long:"Lundi J3",    num:"J3" },
  { court:"Mar", long:"Mardi J4",    num:"J4" },
  { court:"Mer", long:"Mercredi J5", num:"J5" },
  { court:"Jeu", long:"Jeudi J6",    num:"J6" },
  { court:"Ven", long:"Vendredi J7", num:"J7" },
  { court:"Sam", long:"Samedi J8",   num:"J8" },
];

const PARADIGMES = {
  PPS: {
    nom: "PPS — Peripersonal Space",
    couleur: "pps",
    icone: "ti-augmented-reality",
    salle: "Salle PPS",
    description: "Ce paradigme mesure l'espace péripersonnel, la zone autour du corps perçue comme une extension de soi. Vous serez équipé de capteurs et répondrez à des stimuli auditifs et tactiles synchronisés."
  },
  FBI: {
    nom: "FBI — Full Body Illusion",
    couleur: "fbi",
    icone: "ti-3d-cube-sphere",
    salle: "Salle FBI",
    description: "Ce paradigme explore l'illusion de possession corporelle. Vous porterez un casque de réalité virtuelle et vivrez une expérience de synchronisation multisensorielle."
  },
  CFS: {
    nom: "CFS — Continuous Flash Suppression",
    couleur: "cfs",
    icone: "ti-eye",
    salle: "Salle CFS",
    description: "Ce paradigme étudie la conscience visuelle. En regardant dans un stéréoscope, des images seront présentées séparément à chaque œil et vous indiquerez ce que vous percevez."
  }
};

const HORAIRES_SESSIONS = [
  { label: "Matin",       debut: "09h00", fin: "12h00" },
  { label: "Après-midi",  debut: "13h00", fin: "16h00" },
  { label: "Soir",        debut: "16h30", fin: "19h30" },
];

const JOURNEE_TYPE = [
  { time: "07h00–08h00", title: "Méditation du matin",    badge: "med",   hl: "highlight-med"  },
  { time: "08h00–09h00", title: "Petit-déjeuner",         badge: "libre", hl: "highlight-meal" },
  { time: "09h00–12h00", title: "Créneau expérimental 1", badge: null,    hl: null             },
  { time: "12h00–13h00", title: "Déjeuner",               badge: "libre", hl: "highlight-meal" },
  { time: "13h00–16h00", title: "Créneau expérimental 2", badge: null,    hl: null             },
  { time: "16h00–16h30", title: "Pause goûter",           badge: "libre", hl: "highlight-meal" },
  { time: "16h30–19h30", title: "Créneau expérimental 3", badge: null,    hl: null             },
  { time: "20h00–21h00", title: "Dîner",                  badge: "libre", hl: "highlight-meal" },
  { time: "21h00–22h00", title: "Méditation du soir",     badge: "med",   hl: "highlight-med"  },
];

// Génération automatique des 18 participants
// Rotation : chaque participant fait PPS, FBI, CFS dans un ordre différent
// Affectation : 3 créneaux par jour × 6 jours expérimentaux (J2–J7) × 3 salles = 54 slots
// Chaque participant : 1 session par jour de J2 à J4 (3 paradigmes en 3 jours, pas forcément consécutifs)

const ORDRES = [
  ['PPS','FBI','CFS'], ['PPS','CFS','FBI'],
  ['FBI','PPS','CFS'], ['FBI','CFS','PPS'],
  ['CFS','PPS','FBI'], ['CFS','FBI','PPS'],
];

// Jours expérimentaux : indices 1 à 6 (J2 dimanche → J7 vendredi)
// Chaque participant reçoit 3 sessions sur 3 jours différents, 1 créneau par session
// Rotation simple : participant i → jours (i%6)+1, ((i+2)%6)+1, ((i+4)%6)+1 → créneaux (i%3)

function genParticipants(n) {
  const ps = {};
  const slotsUsed = {}; // key: "jourIdx_creneauIdx_para"
  for (let i = 0; i < n; i++) {
    const code = 'P' + String(i+1).padStart(3,'0');
    const ordre = ORDRES[i % 6];
    // Jours expérimentaux pour ce participant : 3 jours parmi J2(1)..J7(6)
    const j1 = 1 + (i % 6);
    const j2 = 1 + ((i + 2) % 6);
    const j3 = 1 + ((i + 4) % 6);
    const jourIdxs = [j1, j2, j3];
    const creneauIdx = i % 3; // 0=matin, 1=aprem, 2=soir

    const sessions = {}; // jourIdx → {paradigme, creneau}
    jourIdxs.forEach((ji, k) => {
      sessions[ji] = { paradigme: ordre[k], creneau: creneauIdx };
    });

    // Planning complet 8 jours
    const planning = {};
    for (let d = 0; d < 8; d++) {
      if (d === 0) {
        planning[d] = { type: 'arrivee' };
      } else if (d === 7) {
        planning[d] = { type: 'depart' };
      } else if (sessions[d]) {
        planning[d] = { type: 'session', ...sessions[d] };
      } else {
        planning[d] = { type: 'libre' };
      }
    }

    ps[code] = { nom: "Participant " + String(i+1).padStart(2,'0'), ordre, planning };
  }
  return ps;
}

const PARTICIPANTS = genParticipants(18);

// ── RENDU ──

function login() {
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  const err = document.getElementById('error-msg');
  if (!code) { err.innerHTML = '<i class="ti ti-alert-circle" style="font-size:14px"></i> Veuillez entrer votre code.'; return; }
  if (!PARTICIPANTS[code]) { err.innerHTML = '<i class="ti ti-alert-circle" style="font-size:14px"></i> Code invalide — vérifiez avec le chercheur.'; return; }
  err.textContent = '';
  renderApp(code);
  show('screen-app');
}

document.getElementById('code-input').addEventListener('keydown', e => { if (e.key==='Enter') login(); });
document.getElementById('code-input').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase();
  document.getElementById('error-msg').textContent = '';
});

function renderApp(code) {
  const p = PARTICIPANTS[code];
  document.getElementById('av').textContent = code;
  document.getElementById('pname').textContent = p.nom;

  const tabs = document.getElementById('day-tabs');
  const panels = document.getElementById('day-panels');
  tabs.innerHTML = ''; panels.innerHTML = '';

  JOURS.forEach((jour, i) => {
    const dayData = p.planning[i];

    // Count tasks for tab
    let count = '';
    if (dayData.type === 'session') count = '1 session';
    else if (dayData.type === 'arrivee') count = 'arrivée';
    else if (dayData.type === 'depart') count = 'départ';
    else count = 'libre';

    const tab = document.createElement('div');
    tab.className = 'day-tab' + (i===0?' active':'');
    tab.dataset.d = i;
    tab.innerHTML = `<div class="dn">${jour.court}</div><div class="dd">${jour.num}</div><div class="dc">${count}</div>`;
    tab.onclick = () => switchDay(i);
    tabs.appendChild(tab);

    const panel = document.createElement('div');
    panel.className = 'day-panel' + (i===0?' active':'');
    panel.dataset.d = i;
    panel.innerHTML = buildDayHTML(jour, dayData, p, code);
    panels.appendChild(panel);
  });
}

function buildDayHTML(jour, dayData, p, code) {
  let html = `<div style="margin-bottom:14px"><p style="font-size:17px;font-weight:600;margin-bottom:3px">${jour.long}</p>`;

  // Progress dots
  const dots = p.ordre.map((para, k) => {
    const done = Object.values(p.planning).filter(d => d.type==='session' && d.paradigme===para).length > 0;
    return `<span class="dot dot-${para.toLowerCase()}" title="${para}"></span>`;
  }).join('');
  html += `<div class="progress-dots">${dots}<span class="dots-label">Paradigmes : ${p.ordre.join(' → ')}</span></div>`;
  html += `</div>`;

  if (dayData.type === 'arrivee') {
    html += `
      <div class="special-card">
        <p class="special-title" style="color:var(--amber)"><i class="ti ti-bus" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>Jour d'arrivée</p>
        <p class="special-sub" style="margin-top:6px">Navettes depuis la gare, accueil, installation dans les chambres. Signature des formulaires de consentement. Présentation générale de l'étude.</p>
      </div>
      <div class="section-label">Programme du soir</div>
      <div class="schedule-list">
        <div class="sched-row"><div class="sched-time">Après-midi</div><div class="sched-title">Accueil, signature des consentements, explications</div></div>
        <div class="sched-row highlight-meal"><div class="sched-time">20h00–21h00</div><div class="sched-title">Dîner de bienvenue</div></div>
        <div class="sched-row highlight-med"><div class="sched-time">21h00–22h00</div><div class="sched-title">Séance de méditation d'introduction</div><span class="sched-badge badge-med">Méditation</span></div>
      </div>`;
  } else if (dayData.type === 'depart') {
    html += `
      <div class="special-card">
        <p class="special-title" style="color:var(--blue)"><i class="ti ti-home" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>Jour de départ</p>
        <p class="special-sub" style="margin-top:6px">Clôture de la semaine, rangement des chambres, navettes vers la gare. Merci pour votre participation !</p>
      </div>
      <div class="section-label">Programme du matin</div>
      <div class="schedule-list">
        <div class="sched-row highlight-med"><div class="sched-time">07h00–08h00</div><div class="sched-title">Méditation de clôture</div><span class="sched-badge badge-med">Méditation</span></div>
        <div class="sched-row highlight-meal"><div class="sched-time">08h00–09h00</div><div class="sched-title">Petit-déjeuner d'au revoir</div></div>
        <div class="sched-row"><div class="sched-time">Matin</div><div class="sched-title">Rangement, navettes vers la gare</div></div>
      </div>`;
  } else if (dayData.type === 'session') {
    const para = PARADIGMES[dayData.paradigme];
    const creneau = HORAIRES_SESSIONS[dayData.creneau];
    html += `
      <div class="section-label">Votre session aujourd'hui</div>
      <div class="paradigm-card para-${para.couleur}">
        <div class="para-header">
          <div class="para-icon"><i class="ti ${para.icone}"></i></div>
          <div>
            <p class="para-name">${para.nom}</p>
            <div class="para-salle"><i class="ti ti-map-pin" style="font-size:13px"></i>${para.salle}</div>
          </div>
          <span class="para-time-badge">${creneau.debut}–${creneau.fin}</span>
        </div>
        <p class="para-desc">${para.description}</p>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div class="para-salle"><i class="ti ti-clock" style="font-size:13px"></i>Durée estimée : 2h30</div>
        </div>
        <a class="survey-btn" href="${LIMESURVEY}?para=${dayData.paradigme}&code=${code}" target="_blank">
          <i class="ti ti-clipboard-list" style="font-size:15px"></i>Ouvrir le questionnaire LimeSurvey
        </a>
      </div>`;

    html += `<div class="section-label">Programme de la journée</div><div class="schedule-list">`;
    JOURNEE_TYPE.forEach(row => {
      let title = row.title;
      let badge = row.badge ? `<span class="sched-badge badge-${row.badge}">${row.badge==='med'?'Méditation':'Libre'}</span>` : '';
      let hl = row.hl || '';

      if (row.title.includes('Créneau')) {
        const idx = parseInt(row.title.slice(-1)) - 1;
        const h = HORAIRES_SESSIONS[idx];
        if (idx === dayData.creneau) {
          title = `<strong>Votre session ${para.nom}</strong> — ${para.salle}`;
          badge = `<span class="sched-badge badge-${para.couleur}">${dayData.paradigme}</span>`;
          hl = `highlight-${para.couleur}`;
        } else {
          title = 'Créneau libre — méditation, promenade, repos';
          badge = `<span class="sched-badge badge-libre">Libre</span>`;
        }
      }
      html += `<div class="sched-row ${hl}"><div class="sched-time">${row.time}</div><div class="sched-title">${title}</div>${badge}</div>`;
    });
    html += `</div>`;
  } else {
    html += `
      <div class="special-card" style="border-color:var(--border)">
        <p class="special-title" style="color:var(--muted)"><i class="ti ti-sun" style="font-size:16px;vertical-align:-2px;margin-right:6px"></i>Journée libre</p>
        <p class="special-sub" style="margin-top:6px">Pas de session expérimentale aujourd'hui. Profitez du temps libre, des séances de méditation et des repas collectifs.</p>
      </div>
      <div class="section-label">Programme de la journée</div><div class="schedule-list">`;
    JOURNEE_TYPE.forEach(row => {
      let title = row.title;
      let badge = row.badge ? `<span class="sched-badge badge-${row.badge}">${row.badge==='med'?'Méditation':'Libre'}</span>` : `<span class="sched-badge badge-libre">Libre</span>`;
      if (row.title.includes('Créneau')) {
        title = 'Temps libre — méditation, promenade, repos';
      }
      html += `<div class="sched-row ${row.hl||''}"><div class="sched-time">${row.time}</div><div class="sched-title">${title}</div>${badge}</div>`;
    });
    html += `</div>`;
  }
  return html;
}

function switchDay(i) {
  document.querySelectorAll('.day-tab').forEach(t => t.classList.toggle('active', +t.dataset.d===i));
  document.querySelectorAll('.day-panel').forEach(p => p.classList.toggle('active', +p.dataset.d===i));
}

function logout() {
  document.getElementById('code-input').value = '';
  document.getElementById('error-msg').textContent = '';
  show('screen-login');
}

function showAdmin() {
  const grid = document.getElementById('admin-grid');
  grid.innerHTML = '';
  Object.entries(PARTICIPANTS).forEach(([code, p]) => {
    const t = document.createElement('div');
    t.className = 'p-tile';
    t.innerHTML = `<div class="p-tile-code">${code}</div><div class="p-tile-name">${p.nom}</div>`;
    t.onclick = () => { renderApp(code); show('screen-app'); };
    grid.appendChild(t);
  });
  show('screen-admin');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
